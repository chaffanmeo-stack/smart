name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-backend: 'cpython'
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev listcleaner openjdk-17-jdk unzip zip

    - name: Build with Buildozer Engine
      uses: ArtemGovorov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug --no-compile-json
        repository_root: .

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Smart-Khata-App
        path: bin/
