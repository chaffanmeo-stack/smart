name: Build Android APK with Buildozer
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3
    - name: Run Buildozer Engine Directly
      uses: ArtemGovorov/buildozer-action@v1
      with:
        command: buildozer android debug --no-compile-json
        repository_root: .
    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Smart-Khata-App
        path: bin/
